[project]
name = "agentic-talk-snippets"
version = "0.1.0"
description = "Working examples from 'AI Stories from the Trenches' — staying in control of agents, measuring what they cost, and choosing how much to delegate."
requires-python = ">=3.10"

# The sample app and every snippet run on the standard library alone. That is a
# deliberate constraint: the point is the technique, not a framework.
dependencies = []

[project.optional-dependencies]
# Only needed by snippets/j-context-scoping/measure.py, to count tokens exactly
# rather than estimating them. Everything else works without it.
tokens = ["anthropic==0.75.0"]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  # PIN BEFORE PUBLISHING — see "Before this repo goes public" in README.md.
  # "ruff==<version>",
]

[tool.pytest.ini_options]
testpaths = ["sampleapp/tests", "snippets"]
pythonpath = ["sampleapp"]
addopts = "-q"
# The eval harness holds verification tests back from the agent and patches them
# into a copy of the app after a run. They are fixtures, and they are meant to
# fail against the unmodified baseline, so they are not part of this suite.
norecursedirs = ["verify", "__pycache__", ".git", ".venv"]

[tool.ruff]
line-length = 100
target-version = "py310"
